<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>企業登録 | 就活管理アプリ</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <h1>就活管理アプリ</h1>
    <p>企業情報を登録</p>
  </header>

  <main>

    <section>
      <h2 id="form-title">企業を追加</h2>

      <form id="company-form">

        <div>
          <label for="company-name">企業名</label>
          <input
            type="text"
            id="company-name"
            name="companyName"
            required
          >
        </div>

        <div>
          <label for="industry">業界</label>
          <select id="industry" name="industry">
            <option value="">選択してください</option>
            <option value="IT・通信">IT・通信</option>
            <option value="メーカー">メーカー</option>
            <option value="金融">金融</option>
            <option value="商社">商社</option>
            <option value="サービス">サービス</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div>
          <label for="deadline">ES締切</label>
          <input
            type="date"
            id="deadline"
            name="deadline"
          >
        </div>

        <div>
          <label for="status">選考状況</label>
          <select id="status" name="status">
            <option value="未エントリー">未エントリー</option>
            <option value="エントリー済み">エントリー済み</option>
            <option value="ES作成中">ES作成中</option>
            <option value="ES提出済み">ES提出済み</option>
            <option value="Webテスト">Webテスト</option>
            <option value="面接">面接</option>
            <option value="内定">内定</option>
          </select>
        </div>

        <div>
          <label for="priority">志望度</label>
          <select id="priority" name="priority">
            <option value="1">★</option>
            <option value="2">★★</option>
            <option value="3">★★★</option>
          </select>
        </div>

        <div>
          <label for="mypage-url">マイページURL</label>
          <input
            type="url"
            id="mypage-url"
            name="myPageUrl"
            placeholder="https://example.com"
          >
        </div>

        <div>
          <label for="memo">メモ</label>
          <textarea
            id="memo"
            name="memo"
            rows="5"
          ></textarea>
        </div>

        <button type="submit" id="submit-btn">登録</button>

      </form>

      <p>
        <a href="index.html">企業一覧に戻る</a>
      </p>

    </section>

  </main>
  <script src="js/form.js"></script>

</body>

</html>
