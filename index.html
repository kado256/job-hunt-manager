<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>就活管理アプリ</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="app-body">

  <header class="app-header">
    <div class="header-container">
      <h1 class="app-title">就活管理アプリ</h1>
      <p class="app-subtitle">企業情報やES締切、選考状況をまとめて管理</p>
    </div>
  </header>

  <main class="main-container">

    <section class="action-bar">
      <h2>企業一覧</h2>

      <a href="company-form.html" class="btn btn-primary">＋ 企業を追加</a>
    </section>

    <section id="search-filter-section" class="filter-card">
      <div class="filter-group">
        <label for="search-input">企業名検索</label>
        <input type="search" id="search-input" placeholder="企業名で検索...">
      </div>

      <div class="filter-group">
        <label for="filter-industry">業界</label>
        <select id="filter-industry">
          <option value="">すべての業界</option>
          <option value="IT・通信">IT・通信</option>
          <option value="メーカー">メーカー</option>
          <option value="金融">金融</option>
          <option value="商社">商社</option>
          <option value="サービス">サービス</option>
          <option value="その他">その他</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="filter-status">選考状況</label>
        <select id="filter-status">
          <option value="">すべての選考状況</option>
          <option value="未エントリー">未エントリー</option>
          <option value="エントリー済み">エントリー済み</option>
          <option value="ES作成中">ES作成中</option>
          <option value="ES提出済み">ES提出済み</option>
          <option value="Webテスト">Webテスト</option>
          <option value="面接">面接</option>
          <option value="内定">内定</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="sort-order">並び替え</label>
        <select id="sort-order">
          <option value="deadline-asc">ES締切が近い順</option>
          <option value="created-desc">登録が新しい順</option>
          <option value="created-asc">登録が古い順</option>
          <option value="priority-desc">志望度が高い順</option>
        </select>
      </div>
    </section>

    <section id="company-list">
    </section>

  </main>

  <!-- 予定登録・編集モーダル -->
  <dialog id="event-form-modal" class="app-modal">
    <div class="modal-header">
      <h3 id="event-modal-title">予定を追加</h3>
      <button type="button" id="close-event-form-btn" class="modal-close-btn" aria-label="閉じる">&times;</button>
    </div>
    <form id="event-form" class="modal-body">
      <input type="hidden" id="event-id" name="id">
      <input type="hidden" id="event-company-id" name="companyId">

      <div class="form-group">
        <label>対象企業</label>
        <p id="event-company-name-display" class="modal-company-name"></p>
      </div>

      <div class="form-group">
        <label for="event-type">予定種別</label>
        <select id="event-type" name="type" required>
          <option value="面接">面接</option>
          <option value="ES締切">ES締切</option>
          <option value="Webテスト">Webテスト</option>
          <option value="説明会">説明会</option>
          <option value="インターン">インターン</option>
          <option value="その他">その他</option>
        </select>
      </div>

      <div class="form-group">
        <label for="event-title">タイトル</label>
        <input type="text" id="event-title" name="title" placeholder="例: 1次面接、会社説明会" required>
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="event-all-day" name="allDay">
          終日予定
        </label>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="event-start">開始日時</label>
          <input type="datetime-local" id="event-start" name="start" required>
        </div>
        <div class="form-group">
          <label for="event-end">終了日時</label>
          <input type="datetime-local" id="event-end" name="end">
        </div>
      </div>

      <div class="form-group">
        <label for="event-location">場所</label>
        <input type="text" id="event-location" name="location" placeholder="例: オンライン(Zoom)、本社6F">
      </div>

      <div class="form-group">
        <label for="event-memo">メモ</label>
        <textarea id="event-memo" name="memo" rows="3" placeholder="Zoomリンク、持ち物、逆質問メモなど"></textarea>
      </div>

      <div class="modal-actions">
        <button type="submit" id="save-event-btn" class="btn btn-primary">保存する</button>
        <button type="button" id="cancel-event-form-btn" class="btn btn-secondary">キャンセル</button>
      </div>
    </form>
  </dialog>

  <!-- 予定一覧モーダル -->
  <dialog id="event-list-modal" class="app-modal">
    <div class="modal-header">
      <div>
        <h3 id="event-list-modal-title">予定一覧</h3>
        <p id="event-list-company-name" class="modal-subtitle"></p>
      </div>
      <button type="button" id="close-event-list-btn" class="modal-close-btn" aria-label="閉じる">&times;</button>
    </div>
    <div class="modal-body">
      <div class="modal-top-action">
        <button type="button" id="modal-add-event-btn" class="btn btn-primary btn-sm">＋ 予定を追加</button>
      </div>
      <div id="modal-events-container" class="events-list">
        <!-- 予定アイテムが動的挿入される -->
      </div>
    </div>
  </dialog>

  <script src="js/events.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
